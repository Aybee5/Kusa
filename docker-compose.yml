# Local development database:  docker compose up -d db
# Whole stack (database + web/API server):  docker compose --profile full up --build
services:
  db:
    # Postgres with PostGIS, so GEO_SEARCH=postgis works locally too.
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: kusa
      POSTGRES_PASSWORD: kusa
      POSTGRES_DB: kusa
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kusa"]
      interval: 5s
      retries: 10

  web:
    build: .
    profiles: ["full"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kusa:kusa@db:5432/kusa
      AUTH_SECRET: change-me-in-production
      SMS_PROVIDER: console
      GEO_SEARCH: postgis
      SEED_DEMO_DATA: "true"
      NUXT_PUBLIC_SHOW_DEMO_ACCOUNTS: "true"
      UPLOADS_DIR: /data/uploads
    ports:
      - "3000:3000"
    volumes:
      - uploads:/data/uploads

volumes:
  db-data:
  uploads:
